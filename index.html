    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Book",
        "name": "The Money Tree of Life",
        "alternativeHeadline": "Growing Financial Literacy for Kids",
        "author": { "@type": "Person", "name": "Cornelius A. Pratt" },
        "publisher": { "@type": "Organization", "name": "Capism Publishing" },
        "inLanguage": "en",
        "genre": "Children's financial literacy",
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 8, "suggestedMaxAge": 15 },
        "description": "Renee and Alex follow a golden leaf to a tree that teaches them to earn, save, budget and build.",
        "url": "https://moneytreeoflife.com/"
      }
    </script>
  </head>
  <body>
    <!--
      The home page hero, as plain HTML: the same words, links and cover the app
      draws (src/home/Opening.tsx), so they are in the page source and on screen
      before any script runs. React replaces everything inside #root when it
      starts. Keep the two in step.
    -->
    <div id="root">
      <div class="home">
        <main>
          <section class="op" aria-labelledby="hero-title">
            <div class="op-stage">
              <div class="op-copy">
                <h1 id="hero-title" class="op-title">
                  <span>Money does not grow on trees.</span> <span class="op-title-gold">Knowledge does.</span>
                </h1>
                <p class="op-sub">
                  <strong>The Money Tree of Life</strong> is a story for kids 8 to 15 and their families.<span class="op-sub-more"> Renee and Alex follow a golden leaf to a tree that teaches them to earn, save, budget and build.</span>
                </p>
                <div class="op-actions">
                  <a href="/flipbook" class="op-btn-wrap">
                    <span class="home-btn home-btn-gold op-btn">
                      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" /></svg>
                      Read the book
                    </span>
                  </a>
                </div>
                <p class="op-meta">
                  <span>By Cornelius A. Pratt</span>
                  <a href="/flipbook?page=53" class="home-link">For educators: answer key and notes</a>
                </p>
              </div>
              <div class="op-book-stage">
                <a href="/flipbook" class="op-book" aria-label="Read the book: The Money Tree of Life">
                  <span class="op-cover">
                    <span class="op-cover-front">
                      <img
                        src="/home/book-cover-480.webp"
                        srcset="/home/book-cover-480.webp 480w, /home/book-cover-960.webp 960w"
                        sizes="(min-width: 900px) 360px, 46vw"
                        width="480"
                        height="720"
                        fetchpriority="high"
                        alt="The cover of The Money Tree of Life by Cornelius A. Pratt: Renee and Alex stand in front of the glowing Money Tree."
                      />
                    </span>
                  </span>
                </a>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <!-- Every address is served this file. Only the home page keeps the hero above. -->
    <script>
      if (location.pathname !== "/") document.getElementById("root").textContent = "";
    </script>
    <noscript>The flip book and the reader need JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
